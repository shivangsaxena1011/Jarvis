[project]
name = "shivani"
version = "0.1.0"
description = "SHIVANI - Personal Autonomous AI Computer Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "pillow>=10.4.0",
    "pyautogui>=0.9.54",
    "pywinauto>=0.6.8",
    "pyperclip>=1.8.2",
    "pygetwindow>=0.0.9",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "websockets>=12.0",
    "python-pptx>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents*",
    "apps*",
    "cli*",
    "core*",
    "integrations*",
    "memory*",
    "notifications*",
    "observability*",
    "recovery*",
    "security*",
    "tools*",
    "vision*",
    "voice*",
    "planning*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]

